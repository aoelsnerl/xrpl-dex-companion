name: Release

on:
  push:
    tags: ['v*']
  # Manual runs create the tag on the selected branch's latest commit.
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, e.g. v1.0.0
        required: true
      notes:
        description: Release notes (Markdown). Leave empty to generate them from merged PRs.
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Package build
        run: cd dist && zip -r "../xrpl-dex-companion-${TAG}.zip" .
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          asset="xrpl-dex-companion-${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (e.g. drafted in the GitHub UI): just attach the build.
            gh release upload "$TAG" "$asset" --clobber
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$NOTES" ]; then
              printf '%s\n' "$NOTES" > notes.md
              set -- --notes-file notes.md
            else
              set -- --generate-notes
            fi
            gh release create "$TAG" "$asset" --title "$TAG" --target "$GITHUB_SHA" "$@"
          else
            # The annotated tag's message becomes the release notes.
            gh release create "$TAG" "$asset" --title "$TAG" --notes-from-tag --verify-tag
          fi
